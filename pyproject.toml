[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shroud"
version = "0.1.0"
description = "A responsive ninja combat sandbox"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["main", "game", "player", "enemy", "combat", "settings", "drawing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
